    accordion_direction = "end"
    border = "secondary"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    foreground = "primary"
    id = "g4"
    members = [ "launcher", "session" ]
    opacity = 1.0
    padding = 6.0
    radius = 8.0

[brightness]
