[notification]
background_opacity = 0.11999999731779099
follow_focused_output = true

[osd]
background_opacity = 0.4999999888241291
follow_focused_output = true
position = "top_right"
position_vertical = "top_right"

[plugin_settings."noctalia/screen_recorder"]
restore_portal = false

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "dotnetrob/cat",
    "noctalia/wallhaven",
    "ezequiel/mango_layouts",
    "kenn/keybind-cheatsheet"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "error"
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
show_location = false

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    default_view = "all"
    fetch_exchange_rates = false
    pinned = [ "Arknights Endfield", "com.spotify.Client", "kdesystemsettings", "steam", "vesktop" ]
    show_app_actions = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    launcher_position = "auto"
    list_item_background = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    confirm_region = true

    [shell.session]
    grid = true
    grid_columns = 5

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Sapphire"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "gtk3",
        "gtk4",
        "kcolorscheme",
        "kitty",
        "mango",
        "niri",
        "qt",
        "starship",
        "umbriel"
    ]
    community_ids = [
        "zen-browser",
        "discord",
        "libreoffice",
        "neovim",
        "obsidian",
        "vscode",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fastfetch",
        "obs",
        "konsole",
        "yazi"
    ]

        [theme.templates.user.nvim_base16]
        input_path = "~/.config/nvim/lua/matugen-template.lua"
        output_path = "~/.config/nvim/lua/matugen.lua"
        post_hook = "pkill -SIGUSR1 nvim"

[wallpaper]
directory = "~/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 800
    recursive = true

    [wallpaper.default]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-Ember.jpg"

    [wallpaper.last]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-Ember.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-EmberFancy.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-Ember.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-Ember.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/spotty/Wallpapers/Upscaled 1080p/wallhaven-EmberFancy.jpg"

[widget.Spacer]
length = 10
type = "spacer"

[widget.Spacer_2]
type = "spacer"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.cat]
cat_size = 34
type = "dotnetrob/cat:cat"

[widget.cat_2]
type = "dotnetrob/cat:cat"

[widget.date]
format = "{: %Y-%m-%d - %H:%M}"

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.launcher]
custom_image = "/usr/share/icons/hicolor/scalable/apps/org.cachyos.hello.svg"
scale = 1.45

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
anchor = true
show_labels = false
