[dock]
auto_hide = true
background_opacity = 0.32999999262392521
concave_edge_corners = false
enabled = true
icon_size = 25
launcher_custom_image = "/usr/share/icons/cachyos.svg"
launcher_icon = "layout-2"
launcher_position = "start"
margin_edge = 8
pinned = [ "dev.noctalia.Noctalia", "zen" ]
position = "left"
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "lock", "lock-and-suspend", "Screen-off" ]

    [idle.behavior.Screen-off]
    action = "command"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "suspend"
    enabled = false
    lock_before_suspend = false
    timeout = 900.0

[location]
auto_locate = true

