    padding = 6.0
    radius = 8.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "secondary"
    border_width = 1.0
    enabled = true
    fill = "on_primary"
    foreground = "primary"
    id = "g3"
    members = [ "cpu", "temp", "ram" ]
